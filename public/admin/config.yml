backend:
  name: github
  branch: main
  repo: roomba200/autonomous_showcase


media_folder: "src/assets/images"
public_folder: "@assets/images"

collections:
  - name: "robots"
    label: "Robots"
    folder: "src/content/robots"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Subtitle"
        name: "subtitle"
        widget: "string"
      - label: "Price"
        name: "price"
        widget: "string"
      - label: "Image"
        name: "image"
        widget: "image"
      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false
      - label: "Description"
        name: "body"
        widget: "markdown"